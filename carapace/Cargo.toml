[package]
name = "carapace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Assemble carapace block-device chains into a read-only device."

[lints]
workspace = true

[[bin]]
name = "carapace"
path = "src/main.rs"

[features]
default = ["gpt"]
# GPT/PARTUUID discovery: `Chain::from_gpt` scans block-device PARTUUIDs.
gpt = []
# File-backed layers: loop-attach `data`/`hash` files via lodown. corium is
# block-only and can omit this.
loop = ["dep:lodown"]

# carapace is Linux-only: the whole library and CLI drive device-mapper. Gate
# the deps to Linux too, so a consumer that pulls the lib on another target
# resolves it to an empty crate instead of compiling the Linux-only ioctl
# stack. Matches the corium/conglobate pattern.
[target.'cfg(target_os = "linux")'.dependencies]
# Safe device-mapper wrapper (all dm unsafe lives here, not in carapace).
# Pinned to the revision that adds `TableBuilder::read_only` (required by
# dm-verity); repoint to a tag/main once that lands on devmap's main.
devmap = { git = "https://github.com/pichi-vm/devmap.git", rev = "6a688a59a162da2b5a9bb33d1611a23550aa2df6" }
# Safe loop-device wrapper for file-backed layers (feature `loop`).
lodown = { git = "https://github.com/pichi-vm/lodown.git", rev = "89913b80fd795c8f7211ae6b4d39b70845b87974", optional = true }
# zerocopy for the verity superblock / snapshot header struct parsing.
zerocopy = { workspace = true }

[dev-dependencies]
serial_test = { version = "3", default-features = false }
tempfile = { workspace = true }
