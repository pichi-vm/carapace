[package]
name = "carapace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Assemble carapace block-device chains into a read-only device."

[lints]
workspace = true

[[bin]]
name = "carapace"
path = "src/main.rs"

[features]
default = ["gpt"]
# GPT/PARTUUID discovery: `Chain::from_gpt` scans block-device PARTUUIDs.
gpt = []
# File-backed layers: loop-attach `data`/`hash` files via lodown. corium is
# block-only and can omit this.
loop = ["dep:lodown"]
# Async discovery and assembly adapters; the default build needs no runtime.
tokio = ["dep:tokio"]

# carapace is Linux-only: the whole library and CLI drive device-mapper. Gate
# the deps to Linux too, so a consumer that pulls the lib on another target
# resolves it to an empty crate instead of compiling the Linux-only ioctl
# stack. Matches the corium/conglobate pattern.
[target.'cfg(target_os = "linux")'.dependencies]
# Device control and the shared verity format. No userspace hashing required.
devmap-linux = { git = "https://github.com/pichi-vm/devmap.git", rev = "7d5bba500410ef30edc7a7da327d04093913a09b" }
devmap-verity = { git = "https://github.com/pichi-vm/devmap.git", rev = "7d5bba500410ef30edc7a7da327d04093913a09b" }
# Safe loop-device wrapper for file-backed layers (feature `loop`).
lodown = { git = "https://github.com/pichi-vm/lodown.git", rev = "31f8951293af180150e5e4c654c47a5b190097b9", optional = true }
tokio = { version = "1", features = ["rt", "fs"], optional = true }
# zerocopy for snapshot header parsing.
zerocopy = { workspace = true }

[dev-dependencies]
serial_test = { version = "3", default-features = false }
tempfile = { workspace = true }
tokio = { version = "1", features = ["rt", "fs", "io-util"] }
